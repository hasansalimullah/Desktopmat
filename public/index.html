<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DESKTOPMAT — Minimal desk mats</title>
<link rel="icon" type="image/png" href="/Images/logo(white).png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --bg-soft: #F6F7F9;
    --text: #0F1729;
    --text-muted: #68707E;
    --accent: #3159F0;
    --accent-tint: #EEF1FE;
    --navy: #0B1220;
    --card-bg: #F2F3F5;
    --border: #E6E8EC;

    --shadow-sm: 0 1px 2px rgba(15, 23, 41, 0.06), 0 1px 1px rgba(15,23,41,0.04);
    --shadow-md: 0 4px 12px rgba(15, 23, 41, 0.08), 0 2px 4px rgba(15,23,41,0.04);
    --shadow-lg: 0 16px 32px rgba(15, 23, 41, 0.12), 0 4px 8px rgba(15,23,41,0.04);

    --r-sm: 8px;
    --r-card: 14px;
    --r-lg: 20px;

    --font-head: 'Plus Jakarta Sans', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; overflow-x: hidden; }
  body {
    font-family: var(--font-body);
    color: var(--text);
    background: var(--bg);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 800; letter-spacing: -0.02em; }
  a { color: inherit; text-decoration: none; }
  button { font-family: var(--font-body); cursor: pointer; border: none; background: none; }
  img { max-width: 100%; display: block; }
  ul { list-style: none; }

  .wrap { max-width: 1076px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Header ---------- */
  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 40;
    background: transparent;
    backdrop-filter: none;
    border-bottom: 0;
  }
  .header-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 72px; max-width: none; padding: 0 clamp(24px, 5.3vw, 80px); position: relative;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-head); font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
  .logo-box { width: 44px; height: 44px; object-fit: contain; }
  .nav-links { display: flex; gap: 32px; position: absolute; left: 50%; transform: translateX(-50%); }
  .nav-links button { font-size: 14px; font-weight: 600; color: var(--text); }
  .nav-links button:hover { color: var(--accent); }
  .header-actions { display: flex; align-items: center; gap: 18px; }
  .icon-btn { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: var(--r-sm); position: relative; }
  .icon-btn:hover { background: var(--bg-soft); }
  .cart-badge {
    position: absolute; top: 2px; right: 2px;
    background: var(--accent); color: white; font-size: 10px; font-weight: 700;
    width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .hamburger { display: none; }

  @media (max-width: 860px) {
    .nav-links { display: none; }
    .hamburger { display: flex; }
  }

  /* ---------- Mobile nav (lives OUTSIDE header in DOM) ---------- */
  #mobile-nav-overlay {
    position: fixed; inset: 0; background: rgba(11,18,32,0.4);
    z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  #mobile-nav-overlay.open { opacity: 1; pointer-events: auto; }
  #mobile-nav {
    position: fixed; top: 0; right: 0; height: 100%; width: 82%; max-width: 340px;
    background: var(--bg); z-index: 91;
    transform: translateX(100%); transition: transform 0.3s ease;
    box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column; padding: 24px;
  }
  #mobile-nav.open { transform: translateX(0); }
  #mobile-nav .mn-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
  #mobile-nav button.mn-link { display: block; padding: 14px 4px; font-size: 17px; font-weight: 700; font-family: var(--font-head); text-align: left; width: 100%; border-bottom: 1px solid var(--border); }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 24px; border-radius: var(--r-sm); font-size: 14px; font-weight: 700; transition: all 0.15s ease; }
  .btn-primary { background: var(--accent); color: white; box-shadow: var(--shadow-sm); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-black { background: var(--text); color: white; }
  .btn-black:hover { background: #000; }
  .btn-outline { background: white; color: var(--text); border: 1px solid var(--border); }
  .btn-outline:hover { border-color: var(--text); }
  .btn-full { width: 100%; }
  .btn-uppercase { text-transform: uppercase; letter-spacing: 0.08em; }
  .btn-plain-link { font-size: 13px; color: var(--text-muted); font-weight: 600; text-align: center; display: block; width: 100%; padding: 8px; }
  .btn-plain-link:hover { color: var(--text); }

  /* ---------- Hero ---------- */
  .hero {
    background: white url('/Images/Default%20Mat/background.png') center / cover no-repeat; border-radius: 0;
    width: 100vw; min-height: 100svh; margin: 0 0 64px calc(50% - 50vw); padding: 72px clamp(24px, 5.3vw, 80px) 40px;
    display: flex; align-items: center; gap: 40px; position: relative;
  }
  .hero > div { position: relative; z-index: 1; max-width: 500px; }
  .hero h1 { font-size: clamp(52px, 6.2vw, 92px); line-height: 0.94; max-width: 480px; text-transform: uppercase; }
  .hero h1 span { display: block; color: var(--accent); }
  .hero p { color: var(--text-muted); margin-top: 28px; max-width: 430px; font-size: clamp(15px, 1.4vw, 20px); line-height: 1.35; }
  .hero-badge { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 72px; height: 72px; margin: 0 0 0 32px; border-radius: 50%; background: rgba(255,255,255,0.9); color: var(--text); font-family: var(--font-mono); font-size: 10px; line-height: 1.05; font-weight: 700; vertical-align: middle; }
  .hero-badge strong { font-size: 25px; }
  .hero .actions { margin-top: 28px; display: flex; gap: 12px; }
  @media (max-width: 900px) {
    .hero { flex-direction: column; justify-content: flex-start; text-align: center; padding: 152px 24px 56px; }
    .hero > div { width: 100%; }
    .hero h1 { font-size: 48px; max-width: 420px; margin-inline: auto; }
    .hero p { margin-inline: auto; }
    .hero-badge { margin-left: 0; }
    .hero .actions { justify-content: center; }
    .hero { background-position: center; }
  }
  @media (max-width: 480px) {
    .hero { margin-bottom: 48px; padding: 144px 20px 40px; }
    .hero h1 { font-size: 42px; max-width: 100%; }
    .hero p { font-size: 14px; }
    .hero .actions { flex-direction: column; width: 100%; }
    .hero .actions .btn { width: 100%; }
  }

  main:not(:has(.hero)) { padding-top: 72px; }

  section.section { margin: 64px 0; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; }
  .section-head h2 { font-size: 24px; }
  .section-head .see-all { font-size: 13px; font-weight: 700; color: var(--accent); }

  /* ---------- Product grid / cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  @media (max-width: 980px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 700px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } }

  .card { cursor: pointer; }
  .card-img-wrap {
    background: var(--card-bg); border-radius: var(--r-card);
    padding: 22px; aspect-ratio: 4 / 5;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    overflow: hidden;
  }
  .card:hover .card-img-wrap { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .card-img-wrap img, .mat-pattern { width: 100%; height: 100%; border-radius: 8px; object-fit: cover; }
  .card-body { padding-top: 14px; }
  .card-name { font-size: 15px; font-weight: 700; font-family: var(--font-head); }
  .card-tagline { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
  .card-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .swatch-row { display: flex; gap: 6px; }
  .swatch-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.08); }
  .card-price { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--text); }
  .badge { position: relative; display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; padding: 4px 8px; border-radius: 6px; background: var(--accent-tint); color: var(--accent); margin-bottom: 8px; }

  /* ---------- Toolbar (shop) ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .toolbar-left { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border); font-size: 13px; font-weight: 600; }
  .chip.active { background: var(--text); color: white; border-color: var(--text); }
  .search-input, .sort-select {
    padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--r-sm);
    font-size: 13px; font-family: var(--font-body); background: white;
  }
  .search-input { min-width: 220px; }

  /* ---------- Product detail ---------- */
  .pdp { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; margin: 40px 0 80px; }
  @media (max-width: 860px) { .pdp { grid-template-columns: 1fr; gap: 28px; } }
  .pdp-img-wrap {
    background: var(--card-bg); border-radius: var(--r-lg); padding: 36px;
    aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
  }
  .pdp-img-wrap img, .pdp-img-wrap .mat-pattern { border-radius: var(--r-sm); width: 100%; height: 100%; object-fit: cover; }
  .pdp-gallery-thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
  .pdp-gallery-thumb { height: 74px; padding: 4px; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; background: var(--card-bg); }
  .pdp-gallery-thumb.selected { border: 2px solid var(--text); }
  .pdp-gallery-thumb img, .pdp-gallery-thumb .mat-pattern { width: 100%; height: 100%; border-radius: 4px; object-fit: cover; }
  .pdp-title { font-size: 30px; margin-bottom: 8px; }
  .pdp-price { font-family: var(--font-mono); font-size: 20px; font-weight: 500; margin-bottom: 10px; }
  .pdp-tagline { color: var(--text-muted); font-size: 15px; margin-bottom: 28px; }
  .pdp-label { font-size: 13px; font-weight: 700; margin-bottom: 12px; }
  .color-grid { display: flex; flex-wrap: wrap; gap: 10px; margin: -2px 0 28px; max-width: 420px; }
  .color-swatch { width: 27px; height: 27px; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 0 1px var(--border); }
  .color-swatch.selected { box-shadow: 0 0 0 2px var(--text); }
  .size-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }
  .size-swatch {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
    background: white; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .size-swatch.selected { border: 2px solid var(--text); box-shadow: 0 0 0 2px white inset; }
  .size-swatch-label { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--text-muted); white-space: nowrap; }
  .qty-stepper { display: flex; align-items: center; border: 1px solid var(--border); border-radius: var(--r-sm); width: fit-content; margin-bottom: 18px; }
  .qty-stepper button { width: 38px; height: 40px; font-size: 16px; font-weight: 700; }
  .qty-stepper span { width: 40px; text-align: center; font-weight: 600; }
  .pdp-desc { margin-top: 32px; font-size: 14px; line-height: 1.7; color: var(--text-muted); }

  /* ---------- Cart drawer ---------- */
  #cart-overlay { position: fixed; inset: 0; background: rgba(11,18,32,0.4); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
  #cart-overlay.open { opacity: 1; pointer-events: auto; }
  #cart-drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 92%; max-width: 420px;
    background: white; z-index: 91; transform: translateX(100%); transition: transform 0.3s ease;
    display: flex; flex-direction: column;
  }
  #cart-drawer.open { transform: translateX(0); }
  .cd-head { padding: 22px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .cd-items { flex: 1; overflow-y: auto; padding: 18px 24px; }
  .cd-item { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--border); }
  .cd-item-img { width: 70px; height: 70px; border-radius: var(--r-sm); background: var(--card-bg); flex-shrink: 0; }
  .cd-item-img .mat-pattern { border-radius: var(--r-sm); }
  .cd-item-info { flex: 1; }
  .cd-item-name { font-size: 14px; font-weight: 700; }
  .cd-item-size { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .cd-item-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .cd-foot { padding: 20px 24px; border-top: 1px solid var(--border); }
  .cd-subtotal { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 14px; font-family: var(--font-mono); font-size: 15px; }
  .cd-empty { text-align: center; color: var(--text-muted); padding: 60px 20px; font-size: 14px; }

  /* ---------- Cart page / Checkout ---------- */
  .cart-page { display: grid; grid-template-columns: 1.6fr 1fr; gap: 40px; margin: 40px 0 80px; align-items: start; }
  @media (max-width: 900px) { .cart-page { grid-template-columns: 1fr; } }
  .summary-panel { background: var(--navy); color: white; border-radius: var(--r-lg); padding: 28px; position: sticky; top: 96px; }
  .summary-panel .row { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; color: #B7C0D4; }
  .summary-panel .row.total { color: white; font-weight: 700; font-size: 17px; border-top: 1px solid rgba(255,255,255,0.14); margin-top: 10px; padding-top: 16px; font-family: var(--font-mono); }
  .promo-row { display: flex; gap: 8px; margin: 14px 0; }
  .promo-row input { flex: 1; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color: white; font-size: 13px; }
  .promo-row button { padding: 10px 16px; background: white; color: var(--navy); border-radius: var(--r-sm); font-size: 13px; font-weight: 700; }

  .checkout-form { display: flex; flex-direction: column; gap: 28px; }
  .form-section { background: var(--bg-soft); border-radius: var(--r-card); padding: 24px; }
  .form-section h3 { font-size: 15px; margin-bottom: 16px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
  .field input, .field select { width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 14px; font-family: var(--font-body); background: white; }
  .ship-option { display: flex; justify-content: space-between; align-items: center; padding: 14px; border: 1px solid var(--border); border-radius: var(--r-sm); margin-bottom: 10px; cursor: pointer; }
  .ship-option.selected { border-color: var(--accent); background: var(--accent-tint); }
  .ship-option.disabled { cursor: not-allowed; opacity: 0.62; }
  .ship-option.disabled .ship-option-price { font-weight: 700; color: var(--text-muted); }
  .ship-option-label { font-size: 14px; font-weight: 600; }
  .ship-option-sub { font-size: 12px; color: var(--text-muted); }
  .ship-option-price { font-family: var(--font-mono); font-size: 13px; }

  /* ---------- Confirmation ---------- */
  .confirm-wrap { max-width: 560px; margin: 80px auto; text-align: center; }
  .confirm-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-tint); color: var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 28px; }
  .confirm-detail { background: var(--bg-soft); border-radius: var(--r-card); padding: 22px; margin-top: 28px; text-align: left; font-size: 14px; }

  /* ---------- Mat pattern placeholders ---------- */
  .mat-pattern { position: relative; background-size: cover; }

  footer { background: var(--navy); color: #B7C0D4; margin-top: 100px; padding: 56px 0 32px; }
  .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 32px; margin-bottom: 40px; }
  @media (max-width: 700px) { .footer-grid { grid-template-columns: 1fr 1fr; } }
  .footer-grid h4 { color: white; font-size: 13px; margin-bottom: 14px; }
  .footer-grid a, .footer-grid button { display: block; font-size: 13px; color: #8B96AC; padding: 5px 0; text-align: left; }
  .footer-bottom { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 24px; font-size: 12px; color: #6C7789; display: flex; justify-content: space-between; }

  .empty-state { text-align: center; padding: 100px 20px; color: var(--text-muted); }
  .empty-state h2 { color: var(--text); margin-bottom: 10px; }
  .newsletter-section { display: flex; justify-content: space-between; align-items: center; gap: 28px; margin: 72px 0 0; padding: 36px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .newsletter-section h2 { font-size: 24px; margin-top: 8px; }
  .newsletter-section p { color: var(--text-muted); margin-top: 6px; font-size: 13px; }
  .newsletter-section form { display: flex; gap: 8px; min-width: min(100%, 390px); }
  .newsletter-section input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r-sm); font: inherit; }
  .eyebrow { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; }
  .info-page { max-width: 680px; margin: 8px auto 80px; padding: 0 20px; }
  .info-page h1 { font-size: 36px; margin: 12px 0; }
  .info-page p { color: var(--text-muted); line-height: 1.8; margin-bottom: 20px; }
  .newsletter-modal-backdrop { position: fixed; inset: 0; background: rgba(11,18,32,0.45); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .newsletter-modal { max-width: 520px; width: 100%; background: white; border-radius: var(--r-lg); padding: 34px; box-shadow: var(--shadow-lg); position: relative; }
  .newsletter-modal h2 { font-size: 28px; margin: 10px 0 8px; }
  .newsletter-modal p { color: var(--text-muted); line-height: 1.6; }
  .newsletter-modal form { display: flex; gap: 8px; margin-top: 22px; }
  .newsletter-modal input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r-sm); font: inherit; }
  .newsletter-close { position: absolute; right: 16px; top: 14px; font-size: 22px; color: var(--text-muted); }
  .newsletter-reopen { position: fixed; right: 0; top: 42%; z-index: 99; padding: 14px 10px; writing-mode: vertical-rl; background: var(--text); color: white; border-radius: 8px 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
  @media (max-width: 700px) { .newsletter-section { display: block; } .newsletter-section form { margin-top: 20px; min-width: 0; } }
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <a class="logo" href="#" onclick="go('home');return false;">
      <img class="logo-box" src="/Images/logo(black).png" alt="" />
      <!--
      <svg class="logo-box" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="#0F1729" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M3 7L12 12L21 7" stroke="#0F1729" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 12V22" stroke="#0F1729" stroke-width="1.6" stroke-linejoin="round"/>
      </svg> -->
      DESKTOPMAT
    </a>
    <nav class="nav-links">
      <button onclick="go('shop')">Shop</button>
      <button onclick="go('shop')">All Colors</button>
      <button onclick="go('info','about')">About</button>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" onclick="openSearch()" aria-label="Search">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#0F1729" stroke-width="1.8"/><path d="M21 21L16.65 16.65" stroke="#0F1729" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" onclick="toggleCart(true)" aria-label="Cart">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M6 6H21L19 15H8L6 6ZM6 6L5 3H2" stroke="#0F1729" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="#0F1729"/><circle cx="18" cy="20" r="1.4" fill="#0F1729"/></svg>
        <span class="cart-badge" id="cart-badge" style="display:none;">0</span>
      </button>
      <button class="icon-btn hamburger" onclick="toggleMobileNav(true)" aria-label="Menu">
